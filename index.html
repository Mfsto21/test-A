<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tic Tac Toe</title>
<style>
  :root {
    --bg: #1a1b26;
    --panel: #24273a;
    --line: #3b3f5c;
    --x-color: #7dd3fc;
    --o-color: #f9a8d4;
    --text: #e6e6f0;
    --muted: #9294b3;
    --accent: #a78bfa;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at top, #2a2c45, var(--bg));
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    color: var(--text);
    padding: 20px;
  }

  .app {
    width: 100%;
    max-width: 420px;
    text-align: center;
  }

  h1 {
    margin: 0 0 4px;
    font-size: 2rem;
    letter-spacing: 2px;
  }

  .subtitle {
    color: var(--muted);
    margin-bottom: 20px;
    font-size: 0.9rem;
  }

  .scoreboard {
    display: flex;
    justify-content: space-between;
    background: var(--panel);
    border-radius: 12px;
    padding: 12px 16px;
    margin-bottom: 16px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
  }

  .score {
    flex: 1;
    text-align: center;
  }

  .score .label {
    font-size: 0.75rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .score .value {
    font-size: 1.4rem;
    font-weight: 700;
  }

  .score.x .value { color: var(--x-color); }
  .score.o .value { color: var(--o-color); }
  .score.draw .value { color: var(--accent); }

  .status {
    min-height: 28px;
    margin-bottom: 16px;
    font-size: 1.1rem;
    font-weight: 600;
  }

  .status.active-x { color: var(--x-color); }
  .status.active-o { color: var(--o-color); }
  .status.win { color: #4ade80; }
  .status.draw { color: var(--accent); }

  .board {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    background: var(--line);
    padding: 8px;
    border-radius: 16px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.4);
  }

  .cell {
    aspect-ratio: 1 / 1;
    background: var(--panel);
    border: none;
    border-radius: 10px;
    font-size: 2.6rem;
    font-weight: 800;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: var(--text);
    transition: background 0.15s ease, transform 0.1s ease;
    user-select: none;
  }

  .cell:hover:not(:disabled) {
    background: #2d3050;
  }

  .cell:active:not(:disabled) {
    transform: scale(0.95);
  }

  .cell:disabled {
    cursor: default;
  }

  .cell.x { color: var(--x-color); }
  .cell.o { color: var(--o-color); }

  .cell.win-cell {
    background: rgba(74, 222, 128, 0.18);
    animation: pop 0.3s ease;
  }

  @keyframes pop {
    0% { transform: scale(0.9); }
    60% { transform: scale(1.08); }
    100% { transform: scale(1); }
  }

  .controls {
    display: flex;
    gap: 10px;
    margin-top: 20px;
  }

  button.action {
    flex: 1;
    padding: 12px;
    border: none;
    border-radius: 10px;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    transition: filter 0.15s ease, transform 0.1s ease;
  }

  button.action:active {
    transform: scale(0.97);
  }

  #newRoundBtn {
    background: var(--accent);
    color: #1a1b26;
  }

  #resetScoreBtn {
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--line);
  }

  button.action:hover {
    filter: brightness(1.1);
  }
</style>
</head>
<body>
  <div class="app">
    <h1>TIC TAC TOE</h1>
    <p class="subtitle">Take turns. First to line up three wins.</p>

    <div class="scoreboard">
      <div class="score x">
        <div class="label">Player X</div>
        <div class="value" id="scoreX">0</div>
      </div>
      <div class="score draw">
        <div class="label">Draws</div>
        <div class="value" id="scoreDraw">0</div>
      </div>
      <div class="score o">
        <div class="label">Player O</div>
        <div class="value" id="scoreO">0</div>
      </div>
    </div>

    <div class="status" id="status">Player X's turn</div>

    <div class="board" id="board" role="grid" aria-label="Tic Tac Toe board"></div>

    <div class="controls">
      <button class="action" id="newRoundBtn">New Round</button>
      <button class="action" id="resetScoreBtn">Reset Scores</button>
    </div>
  </div>

<script>
  const WIN_LINES = [
    [0,1,2], [3,4,5], [6,7,8],
    [0,3,6], [1,4,7], [2,5,8],
    [0,4,8], [2,4,6]
  ];

  const boardEl = document.getElementById('board');
  const statusEl = document.getElementById('status');
  const scoreXEl = document.getElementById('scoreX');
  const scoreOEl = document.getElementById('scoreO');
  const scoreDrawEl = document.getElementById('scoreDraw');
  const newRoundBtn = document.getElementById('newRoundBtn');
  const resetScoreBtn = document.getElementById('resetScoreBtn');

  let board = Array(9).fill(null);
  let currentPlayer = 'X';
  let gameOver = false;
  let scores = { X: 0, O: 0, draw: 0 };

  function createBoard() {
    boardEl.innerHTML = '';
    for (let i = 0; i < 9; i++) {
      const cell = document.createElement('button');
      cell.className = 'cell';
      cell.dataset.index = i;
      cell.setAttribute('aria-label', `Cell ${i + 1}`);
      cell.addEventListener('click', () => handleMove(i));
      boardEl.appendChild(cell);
    }
  }

  function handleMove(index) {
    if (gameOver || board[index]) return;

    board[index] = currentPlayer;
    renderCell(index);

    const winInfo = checkWin();
    if (winInfo) {
      gameOver = true;
      highlightWin(winInfo.line);
      scores[currentPlayer]++;
      updateScores();
      setStatus(`Player ${currentPlayer} wins!`, 'win');
      disableBoard();
      return;
    }

    if (board.every(cell => cell)) {
      gameOver = true;
      scores.draw++;
      updateScores();
      setStatus("It's a draw!", 'draw');
      return;
    }

    currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
    setStatus(`Player ${currentPlayer}'s turn`, currentPlayer === 'X' ? 'active-x' : 'active-o');
  }

  function renderCell(index) {
    const cell = boardEl.children[index];
    cell.textContent = board[index];
    cell.classList.add(board[index].toLowerCase());
    cell.disabled = true;
  }

  function checkWin() {
    for (const line of WIN_LINES) {
      const [a, b, c] = line;
      if (board[a] && board[a] === board[b] && board[a] === board[c]) {
        return { player: board[a], line };
      }
    }
    return null;
  }

  function highlightWin(line) {
    line.forEach(i => boardEl.children[i].classList.add('win-cell'));
  }

  function disableBoard() {
    [...boardEl.children].forEach(cell => cell.disabled = true);
  }

  function setStatus(text, cls) {
    statusEl.textContent = text;
    statusEl.className = 'status' + (cls ? ' ' + cls : '');
  }

  function updateScores() {
    scoreXEl.textContent = scores.X;
    scoreOEl.textContent = scores.O;
    scoreDrawEl.textContent = scores.draw;
  }

  function newRound() {
    board = Array(9).fill(null);
    currentPlayer = 'X';
    gameOver = false;
    createBoard();
    setStatus("Player X's turn", 'active-x');
  }

  function resetScores() {
    scores = { X: 0, O: 0, draw: 0 };
    updateScores();
    newRound();
  }

  newRoundBtn.addEventListener('click', newRound);
  resetScoreBtn.addEventListener('click', resetScores);

  createBoard();
  setStatus("Player X's turn", 'active-x');
</script>
</body>
</html>
